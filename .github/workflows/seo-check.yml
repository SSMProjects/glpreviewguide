# Report-only SEO check: robots tags, canonicals and sitemap.xml must follow the site's rules.
# It never edits files. A red ✗ means a page needs fixing before it goes live.
name: SEO check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check robots, canonicals and sitemap
        run: python3 .github/scripts/seo_check.py
